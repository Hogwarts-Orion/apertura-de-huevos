<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Criaturas Mágicas - Hogwarts Orión</title>
    <style>
        body { 
            margin: 0; 
            background: #0a1a0a url('https://images.unsplash.com/photo-1519751138087-5bf79df62d5b?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
            background-size: cover; font-family: 'Georgia', serif; color: #fff;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: -1; }
        .main-box, .action-box { 
            width: 95%; max-width: 500px; background: rgba(20, 40, 20, 0.9); 
            border: 2px solid #8eeb9b; border-radius: 15px; padding: 25px; 
            text-align: center; box-shadow: 0 0 20px rgba(142, 235, 155, 0.4); margin-bottom: 20px;
        }
        input, select { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; 
            border: 1px solid #8eeb9b; background: #000; color: #8eeb9b; font-size: 15px; box-sizing: border-box; text-align: center;
        }
        .btn-magico { 
            background: #2e7d32; color: white; border: none; padding: 15px; 
            border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px;
        }
        .btn-magico:hover { background: #4caf50; transform: scale(1.02); }
        .historial-box { width: 95%; max-width: 600px; background: rgba(0,0,0,0.9); border: 2px solid #8eeb9b; border-radius: 12px; padding: 20px; }
        .historial-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px; }
        .btn-accion-historial {
            background: #1b381e; color: #8eeb9b; border: 1px solid #8eeb9b; padding: 6px 12px;
            border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .btn-accion-historial:hover { background: #8eeb9b; color: #000; }
        .btn-peligro { border-color: #ff6b6b; color: #ff6b6b; background: #331111; }
        .btn-peligro:hover { background: #ff6b6b; color: #000; }
        .entrada-criatura { 
            position: relative; background: rgba(255,255,255,0.05); border-left: 4px solid #8eeb9b; 
            padding: 15px; margin-bottom: 15px; border-radius: 8px; text-align: left;
        }
        .btn-copiar {
            position: absolute; top: 10px; right: 10px; background: #8eeb9b; color: #000;
            border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold;
        }
        .aviso-limite { font-size: 12px; color: #888; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <h1>🐾 Tienda de Criaturas Mágicas 🐾</h1>
    
    <div class="main-box">
        <h3 style="margin:0; color: #8eeb9b;">🥚 Incubadora de Huevos</h3>
        <input type="text" id="nombre-mago" placeholder="Tu nombre de Mago/Bruja...">
        <button class="btn-magico" onclick="abrirHuevos()">Incubar 1 Huevo ✨</button>
    </div>

    <div class="action-box">
        <h3 style="margin:0; color: #f9e29c;">✨ Habilidades Diarias</h3>
        <input type="text" id="nombre-mascota-accion" placeholder="Nombre de la mascota (ej: Manolito)">
        <input type="text" id="nombre-dueño-accion" placeholder="Nombre del dueño (ej: @Jere)">
        
        <select id="casa-dueño">
            <option value="💚">Slytherin (Verde)</option>
            <option value="❤️">Gryffindor (Rojo)</option>
            <option value="💛">Hufflepuff (Amarillo)</option>
            <option value="💙">Ravenclaw (Azul)</option>
        </select>

        <select id="tipo-mascota">
            <option value="panda">Oso Panda 🐼 (Elegir entre 2 opciones)</option>
            <option value="conejo">Conejo 🐰 (Producto al Azar)</option>
            <option value="caracol">Caracol 🐌 (Artículo Sorpresa)</option>
            <option value="escarbato">Escarbato 🦔 (2.000 Galeones)</option>
            <option value="murcielago">Murciélago 🦇 (Robar 2.000 Galeones)</option>
        </select>

        <button class="btn-magico" style="background: #a48a26;" onclick="usarHabilidad()">Usar Habilidad 🐾</button>
    </div>

    <div id="historial-seccion" class="historial-box">
        <div class="historial-header">
            <h2 style="color:#8eeb9b; margin:0; font-size: 20px;">📜 Registro de Actividad</h2>
            <div>
                <button class="btn-accion-historial" onclick="cargarHistorial(true)">🔄 Actualizar</button>
                <button class="btn-accion-historial btn-peligro" onclick="vaciarTodoElRegistro()">🗑️ Vaciar Historial</button>
            </div>
        </div>
        <div id="log-content">Cargando nidos mágicos...</div>
        <div class="aviso-limite">Mostrando las últimas 25 acciones (se auto-borran pasados 15 días).</div>
    </div>

    <script>
        const FIREBASE_BASE_URL = "https://apertura-de-huevos-default-rtdb.firebaseio.com/criaturas";
        const DB_URL = `${FIREBASE_BASE_URL}.json`;
        const DIAS_EXPIRACION = 15;
        const MS_EXPIRACION = DIAS_EXPIRACION * 24 * 60 * 60 * 1000;
        let ultimoJsonCargado = "";

        // PRODUCTOS DE LA TIENDA
        const OBJETOS_TIENDA = [
            "🔮 Traslador", 
            "📜 Pergamino mágico", 
            "⏱️ El giratiempo", 
            "🪶 La pluma de Hermione", 
            "🗝️🪽 Llave voladora", 
            "💡 El Desiluminador de Ron", 
            "💛🍫 Ranita amarilla", 
            "🖤🍫 Ranita negra", 
            "💜🍫 Ranita lila", 
            "🧡🍫 Ranita naranja", 
            "🤍🍫 Ranita blanca"
        ];

        // PUNTOS AUTORIZADOS
        const PUNTOS_AUTORIZADOS = [
            "5.000 puntos",
            "6.000 puntos",
            "7.000 puntos",
            "8.000 puntos",
            "10.000 puntos"
        ];

        // GALEONES AUTORIZADOS
        const GALEONES_AUTORIZADOS = [
            "3.000 galeones",
            "4.000 galeones",
            "5.000 galeones",
            "6.000 galeones"
        ];

        // LISTA DE LAS 27 MASCOTAS CON TEXTOS ACTUALIZADOS
        const MASCOTAS_LISTA = [
            // Especiales / Tienda
            {n: "OSO PANDA 🐼", h: "Te da a elegir entre 2 opciones al azar de entre 5 combinaciones posibles (Puntos autorizados, Galeones autorizados o Productos del Caldero).", u: "1 uso al día.", a: "Tienda"},
            {n: "CONEJO 🐰", h: "Un producto al azar de la tienda todos los días (Traslador, Giratiempo, Pluma, Ranitas, etc.).", u: "1 uso al día.", a: "Tienda"},
            {n: "SNAIL (CARACOL) 🐌", h: "Entrega un artículo/producto sorpresa del Caldero tras participar en una dinámica.", u: "1 uso al día.", a: "Tienda"},
            {n: "ESCARBATO 🦔", h: "Encuentra 2.000 galeones directos para su dueño.", u: "1 uso al día.", a: "Tienda"},
            {n: "MURCIÉLAGO 🦇", h: "Roba 2.000 galeones a otro usuario al azar para dárselos a su dueño.", u: "1 uso al día.", a: "Tienda"},

            // Dinámicas y Actividades
            {n: "PERRO 🐩", h: "Posibilidad de obtener puntos dobles en dinámicas.", u: "1 uso al día (válido por 3 rondas).", a: "Dinámica"},
            {n: "GATO 🐈‍⬛", h: "Te ayuda a quedar automáticamente en segundo lugar si no lograste llegar de primero.", u: "1 uso al día (válido por 3 rondas).", a: "Actividad"},
            {n: "LORO 🦜", h: "Imita a otro jugador copiando exactamente sus puntos ganados.", u: "1 uso al día (válido por 3 rondas).", a: "Dinámica"},
            {n: "ARDILLA 🐿️", h: "Bonificación de un +50% extra en tus puntos de participación.", u: "1 uso al día.", a: "Dinámica"},
            {n: "UNICORNIO 🦄", h: "Te otorga los puntos o galeones de dinámicas en las que no pudiste participar.", u: "1 uso al día.", a: "Tienda"},

            // Retos y Clases
            {n: "DEMIGUISE 🦥", h: "Realiza un Reto Flash completo por ti.", u: "2 usos al día.", a: "Reto Flash"},
            {n: "MARIPOSA 🦋", h: "Aumento del +50% en los puntos obtenidos en Retos Flash.", u: "2 usos al día.", a: "Flash"},
            {n: "ELFO DOMÉSTICO 🧌", h: "Te permite cobrar los puntos y galeones de retos diarios sin tener que realizarlos.", u: "1 uso al día.", a: "Retos"},
            {n: "LECHUZA 🦉", h: "Duplica el 30% de los puntos y galeones de participación ganados en clases.", u: "1 uso al día.", a: "Clase"},

            // Duelo, Quidditch y Rol
            {n: "FÉNIX 🐦‍🔥", h: "Te revive si pierdes un duelo y duplica los galeones ganados.", u: "1 por duelo (máximo 2 al día).", a: "Duelo"},
            {n: "ACROMÁNTULA 🕷️", h: "Le resta una ronda a tu rival en duelo y duplica tus galeones.", u: "1 por duelo (máximo 2 al día).", a: "Duelo"},
            {n: "COLACUERNO HÚNGARO 🐲", h: "Otorga un +50% extra de puntos y galeones por participación en partidos de Quidditch.", u: "1 uso por partido.", a: "Estadio"},
            {n: "DELFÍN 🐬", h: "Te da un +30% adicional de puntos en actividades de rol.", u: "1 uso por copa.", a: "Grupo de Rol"},

            // Tienda, Economía y Robos
            {n: "JAGUAR 🐆", h: "Te permite robar y usar la habilidad de cualquier otra mascota durante todo el día.", u: "1 uso al día.", a: "Tienda"},
            {n: "RATÓN 🐁", h: "Permite robar un producto al azar a elección del dueño.", u: "1 uso al día.", a: "Tienda"},
            {n: "RANA 🐸", h: "Roba puntos y galeones al azar generados en actividades del día donde el dueño participó.", u: "1 uso al día.", a: "Tienda"},
            {n: "LOBO 🐺", h: "20% de descuento en compras dentro de cualquier tienda de Orión.", u: "1 uso al día.", a: "Tiendas"},
            {n: "PATO 🦆", h: "Te regala 1 figura del album de Orión al día.", u: "1 uso al día.", a: "Tienda de cromos"},
            {n: "NUTRIA 🦦", h: "Recompensa con un +25% más de puntos de participación en el bar Las Tres Escobas.", u: "1 uso al día.", a: "Bar 3 Escobas"},

            // Redes, Promoción y Galería
            {n: "BOWTRUCKLE 🌱", h: "Aumenta el límite de archivos que puedes subir en Galería/Red (+5 archivos).", u: "1 uso al día.", a: "Galería / Red"},
            {n: "ABEJA 🐝", h: "Proporciona un +10% adicional de puntos obtenidos en Promoción y Galería.", u: "1 uso al día en cada grupo.", a: "Galería y Red"},
            {n: "HADA 🧚🏻", h: "Otorga 10 capturas de promoción diarias automáticas.", u: "1 uso al día.", a: "Red de Promoción"}
        ];

        function aleatorio(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function dosDistintos(arr) {
            let item1 = aleatorio(arr);
            let item2 = aleatorio(arr);
            while (arr.length > 1 && item1 === item2) {
                item2 = aleatorio(arr);
            }
            return [item1, item2];
        }

        function abrirHuevos() {
            const campo = document.getElementById('nombre-mago');
            const nombre = campo.value.trim() || "Mago/Bruja";
            const m = MASCOTAS_LISTA[Math.floor(Math.random() * MASCOTAS_LISTA.length)];
            const textoCopiable = `⋆ ——————✧◦🥚◦✧—————— ⋆\n\n      ✨ ᴍᴀꜱᴄᴏᴛᴀꜱ ✨\n\n   🎉¡Felicidades @${nombre}! te toco un 🎉\n\n➢${m.n}\n${m.h}\n\n→ Habilidad desbloqueada en el día 10\n\n》${m.u.toUpperCase()}\n\n> Avisar de su uso en ${m.a}\n\n⋆ ——————✧◦🥚◦✧—————— ⋆`;
            
            enviarHistorial(nombre, `Ha incubado un huevo: <b>${m.n}</b>`, textoCopiable);
            campo.value = "";
        }

        function usarHabilidad() {
            const mascotaInput = document.getElementById('nombre-mascota-accion');
            const dueñoInput = document.getElementById('nombre-dueño-accion');
            const mascotaNom = mascotaInput.value.trim() || "Tu mascota";
            const dueñoNom = dueñoInput.value.trim() || "@Mago";
            const casaEmoji = document.getElementById('casa-dueño').value;
            const tipo = document.getElementById('tipo-mascota').value;
            
            let resultado = "";
            let logTexto = "";

            if (tipo === "panda") {
                const combinaciones = [
                    "puntos_producto",
                    "producto_producto",
                    "galeones_producto",
                    "puntos_puntos",
                    "galeones_galeones"
                ];
                const tipoElegido = aleatorio(combinaciones);
                let p1 = "", p2 = "";

                if (tipoElegido === "puntos_producto") {
                    p1 = aleatorio(PUNTOS_AUTORIZADOS);
                    p2 = aleatorio(OBJETOS_TIENDA);
                    if (Math.random() > 0.5) [p1, p2] = [p2, p1];
                } else if (tipoElegido === "producto_producto") {
                    [p1, p2] = dosDistintos(OBJETOS_TIENDA);
                } else if (tipoElegido === "galeones_producto") {
                    p1 = aleatorio(GALEONES_AUTORIZADOS);
                    p2 = aleatorio(OBJETOS_TIENDA);
                    if (Math.random() > 0.5) [p1, p2] = [p2, p1];
                } else if (tipoElegido === "puntos_puntos") {
                    [p1, p2] = dosDistintos(PUNTOS_AUTORIZADOS);
                } else if (tipoElegido === "galeones_galeones") {
                    [p1, p2] = dosDistintos(GALEONES_AUTORIZADOS);
                }

                resultado = `×🐼 ${mascotaNom} te da elegir entre: [${casaEmoji}]\n1. ${p1}\n2. ${p2}\n${dueñoNom} ${casaEmoji}×`;
                logTexto = `El Panda <b>${mascotaNom}</b> ofreció elegir entre: 1) ${p1} | 2) ${p2} a ${dueñoNom}`;
            } else if (tipo === "conejo") {
                const pr = aleatorio(OBJETOS_TIENDA);
                resultado = `×🐰 ${mascotaNom} te trae suerte: [${casaEmoji}] ¡Has ganado ${pr}! ${dueñoNom} ${casaEmoji}×`;
                logTexto = `El Conejo encontró ${pr} para ${dueñoNom}`;
            } else if (tipo === "caracol") {
                const pr = aleatorio(OBJETOS_TIENDA);
                resultado = `×🐌 ${mascotaNom} entrega el artículo sorpresa tras dinámica: [${casaEmoji}] ${pr} ${dueñoNom} ${casaEmoji}×`;
                logTexto = `El Caracol entregó ${pr} a ${dueñoNom}`;
            } else if (tipo === "escarbato") {
                resultado = `×🦔 ¡${mascotaNom} ha encontrado 2.000 G 🪙 para ${dueñoNom} [${casaEmoji}]! ×`;
                logTexto = `El Escarbato encontró galeones para ${dueñoNom}`;
            } else if (tipo === "murcielago") {
                resultado = `×🦇 ¡${mascotaNom} ha robado 2.000 G 🪙 para ${dueñoNom} [${casaEmoji}]! ×`;
                logTexto = `El Murciélago robó galeones para ${dueñoNom}`;
            }

            enviarHistorial(dueñoNom, logTexto, resultado);
            mascotaInput.value = "";
            dueñoInput.value = "";
        }

        function enviarHistorial(nombre, logTexto, copiaTexto) {
            const nuevoRegistro = {
                timestamp: Date.now(),
                nombre: nombre,
                logTexto: logTexto,
                copiaTexto: copiaTexto
            };

            fetch(DB_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoRegistro) 
            }).then(() => {
                cargarHistorial(true);
                document.getElementById('historial-seccion').scrollIntoView({ behavior: 'smooth' });
            }).catch(err => console.error("Error al registrar:", err));
        }

        function renderizarEntrada(item) {
            const fecha = item.timestamp ? new Date(item.timestamp).toLocaleString() : 'Fecha anterior';
            const nombre = item.nombre || 'Mago';
            const logTexto = item.logTexto || '';

            return `<div class="entrada-criatura">
                <button class="btn-copiar" onclick="copiar(this)">Copiar 📋</button>
                <div style="font-size:11px; color:#aaa; margin-bottom:5px;">${fecha}</div>
                <div style="color:#8eeb9b; font-weight:bold;">🧙‍♂️ ${nombre}:</div>
                <div style="color:#fff;">${logTexto}</div>
                <textarea style="display:none">${item.copiaTexto || ''}</textarea>
            </div>`;
        }

        function cargarHistorial(forzar = false) {
            fetch(DB_URL)
                .then(res => res.json())
                .then(data => {
                    const log = document.getElementById('log-content');
                    if (!data) {
                        log.innerHTML = "<p style='color:#888;'>No hay registros activos todavía.</p>";
                        ultimoJsonCargado = "";
                        return;
                    }

                    const dataString = JSON.stringify(data);
                    if (!forzar && dataString === ultimoJsonCargado) return;
                    ultimoJsonCargado = dataString;

                    const ahora = Date.now();
                    const entries = Object.entries(data);
                    const entradasValidas = [];

                    entries.forEach(([key, val]) => {
                        let item = val;
                        if (typeof val === 'string') {
                            entradasValidas.push({ key: key, rawHtml: val });
                            return;
                        }

                        // Purga automática de más de 15 días
                        if (item.timestamp && (ahora - item.timestamp > MS_EXPIRACION)) {
                            fetch(`${FIREBASE_BASE_URL}/${key}.json`, { method: 'DELETE' });
                        } else {
                            entradasValidas.push({ key: key, item: item });
                        }
                    });

                    entradasValidas.reverse();
                    const entradasAMostrar = entradasValidas.slice(0, 25);

                    let html = "";
                    entradasAMostrar.forEach(e => {
                        if (e.rawHtml) {
                            html += e.rawHtml;
                        } else {
                            html += renderizarEntrada(e.item);
                        }
                    });

                    log.innerHTML = html || "<p style='color:#888;'>Sin registros recientes.</p>";
                })
                .catch(err => {
                    console.error("Error al cargar historial:", err);
                });
        }

        function copiar(btn) {
            const txt = btn.parentElement.querySelector('textarea').value;
            navigator.clipboard.writeText(txt).then(() => {
                btn.innerText = "¡Copiado! ✅";
                setTimeout(() => btn.innerText = "Copiar 📋", 2000);
            });
        }

        function vaciarTodoElRegistro() {
            const confirmacion = confirm("⚠️ ¿Estás seguro de que deseas vaciar TODO el registro de actividad? Esta acción no se puede deshacer.");
            if (confirmacion) {
                fetch(DB_URL, { method: 'DELETE' })
                    .then(() => {
                        ultimoJsonCargado = "";
                        cargarHistorial(true);
                        alert("Registro vaciado con éxito.");
                    })
                    .catch(err => alert("Error al vaciar: " + err));
            }
        }

        window.onload = () => cargarHistorial(true);
        setInterval(() => cargarHistorial(false), 10000);
    </script>
</body>
</html>
