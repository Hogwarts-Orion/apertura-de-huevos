<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Criaturas Mágicas - Hogwarts Orión</title>
    <style>
        body { 
            margin: 0; 
            background: #0a1a0a url('https://images.unsplash.com/photo-1519751138087-5bf79df62d5b?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
            background-size: cover; font-family: 'Georgia', serif; color: #fff;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: -1; }
        .main-box, .action-box { 
            width: 95%; max-width: 500px; background: rgba(20, 40, 20, 0.9); 
            border: 2px solid #8eeb9b; border-radius: 15px; padding: 25px; 
            text-align: center; box-shadow: 0 0 20px rgba(142, 235, 155, 0.4); margin-bottom: 20px;
        }
        input, select { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; 
            border: 1px solid #8eeb9b; background: #000; color: #8eeb9b; font-size: 15px; box-sizing: border-box; text-align: center;
        }
        .btn-magico { 
            background: #2e7d32; color: white; border: none; padding: 15px; 
            border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px;
        }
        .btn-magico:hover { background: #4caf50; transform: scale(1.02); }
        .historial-box { width: 95%; max-width: 600px; background: rgba(0,0,0,0.9); border: 2px solid #8eeb9b; border-radius: 12px; padding: 20px; }
        .entrada-criatura { 
            position: relative; background: rgba(255,255,255,0.05); border-left: 4px solid #8eeb9b; 
            padding: 15px; margin-bottom: 15px; border-radius: 8px; text-align: left;
        }
        .btn-copiar {
            position: absolute; top: 10px; right: 10px; background: #8eeb9b; color: #000;
            border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <h1>🐾 Tienda de Criaturas Mágicas 🐾</h1>
    
    <div class="main-box">
        <h3 style="margin:0; color: #8eeb9b;">🥚 Incubadora de Huevos</h3>
        <input type="text" id="nombre-mago" placeholder="Tu nombre de Mago/Bruja...">
        <button class="btn-magico" onclick="abrirHuevos()">Incubar 1 Huevo ✨</button>
    </div>

    <div class="action-box">
        <h3 style="margin:0; color: #f9e29c;">✨ Habilidades Diarias</h3>
        <input type="text" id="nombre-mascota-accion" placeholder="Nombre de la mascota (ej: Manolito)">
        <input type="text" id="nombre-dueño-accion" placeholder="Nombre del dueño (ej: @Jere)">
        
        <select id="casa-dueño">
            <option value="💚">Slytherin (Verde)</option>
            <option value="❤️">Gryffindor (Rojo)</option>
            <option value="💛">Hufflepuff (Amarillo)</option>
            <option value="💙">Ravenclaw (Azul)</option>
        </select>

        <select id="tipo-mascota">
            <option value="panda">Oso Panda 🐼 (Elegir entre 2 opciones)</option>
            <option value="conejo">Conejo 🐰 (Producto al Azar)</option>
            <option value="caracol">Caracol 🐌 (Artículo Sorpresa)</option>
            <option value="escarbato">Escarbato 🦔 (2.000 Galeones)</option>
            <option value="murcielago">Murciélago 🦇 (Robar 2.000 Galeones)</option>
        </select>

        <button class="btn-magico" style="background: #a48a26;" onclick="usarHabilidad()">Usar Habilidad 🐾</button>
    </div>

    <div id="historial-seccion" class="historial-box">
        <h2 style="color:#8eeb9b; text-align:center; margin-top:0;">📜 Registro de Actividad</h2>
        <div id="log-content">Cargando nidos mágicos...</div>
    </div>

    <script>
        const DB_URL = "https://apertura-de-huevos-default-rtdb.firebaseio.com/criaturas.json";

        // LISTA ACTUALIZADA SEGÚN EL CALDERO CHORREANTE
        const OBJETOS_TIENDA = [
            "Traslador 🔮", 
            "Pergamino mágico 📜", 
            "El giratiempo ⏱️", 
            "La pluma de Hermione 🪶", 
            "Llave voladora 🗝️🪽", 
            "El Desiluminador de Ron 💡", 
            "Ranita amarilla 💛🍫", 
            "Ranita negra 🖤🍫", 
            "Ranita lila 💜🍫", 
            "Ranita naranja 🧡🍫", 
            "Ranita blanca 🤍🍫"
        ];

        // Se han eliminado los premios anteriores para dejar solo la lista nueva
        const PREMIOS_GENERALES = []; 

        const MASCOTAS_LISTA = [
            {n: "JAGUAR 🐆", h: "Permite robar una habilidad de otra mascota por un día.", u: "1 uso al día.", a: "Tienda"},
            {n: "PERRO 🐩", h: "Posibilidad de obtener puntos dobles en dinámica.", u: "1 uso al día, 5 rondas.", a: "Dinámica"},
            {n: "GATO 🐈‍⬛", h: "Ayuda a quedar en segundo lugar si no llegas primero.", u: "1 uso al día, 5 rondas.", a: "Actividad"},
            {n: "LORO 🦜", h: "Imita a otro jugador copiando sus puntos en 3 rondas.", u: "1 uso al día.", a: "Dinámica"},
            {n: "ARDILLA 🐿️", h: "Bonificación de 50% en puntos de participación.", u: "1 uso al día.", a: "Dinámica"},
            {n: "UNICORNIO 🦄", h: "Otorga puntos/galeones de dinámicas no participadas.", u: "1 uso al día.", a: "Tienda"},
            {n: "ELFO DOMÉSTICO 🧌", h: "Ayuda a obtener puntos/galeones en retos diarios sin realizarlos.", u: "1 uso al día.", a: "Retos"},
            {n: "LECHUZA 🦉", h: "Duplica los puntos y galeones en clases.", u: "1 uso al día.", a: "Clase"},
            {n: "DEMIGUISE 🦥", h: "Puede hacer un reto flash por ti.", u: "2 usos al día.", a: "Reto Flash"},
            {n: "MARIPOSA 🦋", h: "Da un 50% de aumento en puntos en Retos Flash.", u: "2 usos al día.", a: "Flash"},
            {n: "RANA 🐸", h: "Roba puntos y galeones al azar de actividades del día.", u: "1 uso al día.", a: "Tienda"},
            {n: "NUTRIA 🦦", h: "Recompensa con un 25% más de participación en 3 Escobas.", u: "1 uso al día.", a: "Bar 3 Escobas"},
            {n: "FLAMENCO 🦩", h: "Da un 20% de descuento en el Caldero y Flourish.", u: "1 uso al día.", a: "Tiendas"},
            {n: "LOBO 🐺", h: "20% descuento en el Caldero y Tienda de Mascotas.", u: "1 uso al día.", a: "Tiendas"},
            {n: "TORTUGA 🐢", h: "20% de descuento en el Cromo de Ranas Chocolate.", u: "1 uso al día.", a: "Tienda de cromos"},
            {n: "PATO 🦆", h: "Otorga 1 cromo gratis al día.", u: "1 uso al día.", a: "Tienda de cromos"},
            {n: "BOWTRUCKLE 🌱", h: "Aumenta el máximo de archivos en Galería/Red (+5).", u: "1 uso al día.", a: "Galería / Red"},
            {n: "ABEJA 🐝", h: "Proporciona 5% más de puntos en Promoción y Galería.", u: "1 uso al día.", a: "Galería / Red"},
            {n: "HADA 🧚🏻", h: "Te da 10 capturas de promoción diarias.", u: "1 uso al día.", a: "Red de Promoción"},
            {n: "FÉNIX 🐦‍🔥", h: "Revive en duelo perdido y duplica galeones.", u: "1 por duelo, 2 al día.", a: "Duelo"},
            {n: "ACROMÁNTULA 🕷️", h: "Resta una ronda al rival y duplica galeones.", u: "1 por duelo, 2 al día.", a: "Duelo"},
            {n: "COLACUERNO HÚNGARO 🐲", h: "50% más de puntos en Quidditch por participación.", u: "1 uso por partido.", a: "Estadio"},
            {n: "HOCICORTO SUECO 🐗", h: "Te da el doble de galeones en Quidditch.", u: "1 uso por partido.", a: "Estadio"},
            {n: "DELFÍN 🐬", h: "Eliges 5% extra en puntos o galeones en rol.", u: "1 uso por copa.", a: "Grupo de Rol"},
            {n: "RATÓN 🐁", h: "Roba un producto a otra persona (No 🧪🍀🔮🍭⚡).", u: "1 uso al día.", a: "Tienda"},
            {n: "OSO PANDA 🐼", h: "Elegir entre 2 cosas aleatorias (puntos, objetos, etc).", u: "1 uso al día.", a: "Tienda"},
            {n: "SNAIL (CARACOL) 🐌", h: "Recibe un artículo sorpresa tras una dinámica.", u: "1 uso al día.", a: "Tienda"},
            {n: "CONEJO 🐰", h: "Ganas un producto al azar todos los días.", u: "1 uso al día.", a: "Tienda"},
            {n: "ESCARBATO 🦔", h: "Encuentra 2.000 galeones para el dueño.", u: "1 uso al día.", a: "Tienda"},
            {n: "MURCIÉLAGO 🦇", h: "Roba 2.000 galeones a alguien al azar.", u: "1 uso al día.", a: "Tienda"},
            {n: "OVEJA 🐑", h: "Roba 3 fichas a una persona en el casino.", u: "1 uso al día.", a: "Casino"}
        ];

        function abrirHuevos() {
            const nombre = document.getElementById('nombre-mago').value || "Mago/Bruja";
            const m = MASCOTAS_LISTA[Math.floor(Math.random() * MASCOTAS_LISTA.length)];
            let textoCopiable = `⋆ ——————✧◦🥚◦✧—————— ⋆\n\n      ✨ ᴍᴀꜱᴄᴏᴛᴀꜱ ✨\n\n   🎉¡Felicidades @${nombre}! te toco un 🎉\n\n➢${m.n}\n${m.h}\n\n→ Habilidad desbloqueada en el día 10\n\n》${m.u.toUpperCase()}\n\n> Avisar de su uso en ${m.a}\n\n⋆ ——————✧◦🥚◦✧—————— ⋆`;
            enviarHistorial(nombre, `Ha incubado un huevo: <b>${m.n}</b>`, textoCopiable);
            document.getElementById('nombre-mago').value = "";
        }

        function usarHabilidad() {
            const mascotaNom = document.getElementById('nombre-mascota-accion').value || "Tu mascota";
            const dueñoNom = document.getElementById('nombre-dueño-accion').value || "@Mago";
            const casaEmoji = document.getElementById('casa-dueño').value;
            const tipo = document.getElementById('tipo-mascota').value;
            
            let resultado = "";
            let logTexto = "";
            // Ahora la lista solo contiene los objetos del Caldero Chorreante
            const listaCompleta = [...OBJETOS_TIENDA];

            if(tipo === "panda") {
                let p1 = listaCompleta[Math.floor(Math.random() * listaCompleta.length)];
                let p2 = listaCompleta[Math.floor(Math.random() * listaCompleta.length)];
                while(p1 === p2) { p2 = listaCompleta[Math.floor(Math.random() * listaCompleta.length)]; }
                resultado = `×🐼 ${mascotaNom} te da elegir entre: [${casaEmoji}]\n1. ${p1}\n2. ${p2}\n${dueñoNom} ${casaEmoji}×`;
                logTexto = `El Panda <b>${mascotaNom}</b> ofreció 2 opciones a ${dueñoNom}`;
            } else if(tipo === "conejo") {
                const pr = OBJETOS_TIENDA[Math.floor(Math.random() * OBJETOS_TIENDA.length)];
                resultado = `×🐰 ${mascotaNom} te trae suerte: [${casaEmoji}] ¡Has ganado ${pr}! ${dueñoNom} ${casaEmoji}×`;
                logTexto = `El Conejo encontró un objeto para ${dueñoNom}`;
            } else if(tipo === "caracol") {
                const pr = OBJETOS_TIENDA[Math.floor(Math.random() * OBJETOS_TIENDA.length)];
                resultado = `×🐌 ${mascotaNom} entrega el artículo sorpresa tras dinámica: [${casaEmoji}] ${pr} ${dueñoNom} ${casaEmoji}×`;
                logTexto = `El Caracol entregó un artículo sorpresa a ${dueñoNom}`;
            } else if(tipo === "escarbato") {
                resultado = `×🦔 ¡${mascotaNom} ha encontrado 2.000 G 🪙 para ${dueñoNom} [${casaEmoji}]! ×`;
                logTexto = `El Escarbato encontró galeones para ${dueñoNom}`;
            } else if(tipo === "murcielago") {
                resultado = `×🦇 ¡${mascotaNom} ha robado 2.000 G 🪙 para ${dueñoNom} [${casaEmoji}]! ×`;
                logTexto = `El Murciélago robó galeones para ${dueñoNom}`;
            }

            enviarHistorial(dueñoNom, logTexto, resultado);
            document.getElementById('nombre-mascota-accion').value = "";
            document.getElementById('nombre-dueño-accion').value = "";
        }

        function enviarHistorial(nombre, logTexto, copiaTexto) {
            const htmlEntrada = `<div class="entrada-criatura">
                <button class="btn-copiar" onclick="copiar(this)">Copiar 📋</button>
                <div style="font-size:11px; color:#aaa; margin-bottom:5px;">${new Date().toLocaleString()}</div>
                <div style="color:#8eeb9b; font-weight:bold;">🧙‍♂️ ${nombre}:</div>
                <div style="color:#fff;">${logTexto}</div>
                <textarea style="display:none">${copiaTexto}</textarea>
            </div>`;
            fetch(DB_URL, { method: 'POST', body: JSON.stringify(htmlEntrada) }).then(() => {
                cargarHistorial();
                document.getElementById('historial-seccion').scrollIntoView({ behavior: 'smooth' });
            });
        }

        function copiar(btn) {
            const txt = btn.parentElement.querySelector('textarea').value;
            navigator.clipboard.writeText(txt).then(() => {
                btn.innerText = "¡Copiado! ✅";
                setTimeout(() => btn.innerText = "Copiar 📋", 2000);
            });
        }

        function cargarHistorial() {
            fetch(DB_URL).then(res => res.json()).then(data => {
                const log = document.getElementById('log-content');
                if(!data) return;
                let html = "";
                Object.values(data).reverse().forEach(e => html += e);
                log.innerHTML = html;
            });
        }

        window.onload = cargarHistorial;
        setInterval(cargarHistorial, 5000);
    </script>
</body>
</html>
